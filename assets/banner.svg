<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Welcome to GDG OAU">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EEF1F6" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="400" rx="32"/></clipPath>
  </defs>
  <rect width="1200" height="400" rx="32" fill="#FFFFFF"/>
  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#grid)"/>
    <g fill="none" stroke-width="3" opacity="0.5">
      <circle cx="70" cy="400" r="110" stroke="#188038"/>
      <circle cx="190" cy="400" r="110" stroke="#F9AB00"/>
      <circle cx="310" cy="400" r="110" stroke="#D93025"/>
    </g>
    <g fill="none" stroke-width="3" opacity="0.5">
      <circle cx="1130" cy="0" r="110" stroke="#1A73E8"/>
      <circle cx="1010" cy="0" r="110" stroke="#188038"/>
    </g>
    <rect y="388" width="300" height="12" fill="#1A73E8"/>
    <rect x="300" y="388" width="300" height="12" fill="#188038"/>
    <rect x="600" y="388" width="300" height="12" fill="#F9AB00"/>
    <rect x="900" y="388" width="300" height="12" fill="#D93025"/>
  </g>
  <g font-family="'Google Sans','Product Sans','Segoe UI',Roboto,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="92" font-size="30" fill="#1F1F1F">Google Developer Group</text>
    <text x="600" y="128" font-size="24" fill="#1A73E8">On Campus - OAU</text>
    <text x="600" y="240" font-size="92" font-weight="500" letter-spacing="-2" fill="#1F1F1F">Welcome to GDG OAU</text>
    <text x="600" y="296" font-size="30" fill="#444746">Learn. Build. Ship. Together.</text>
    <text x="600" y="350" font-size="26" font-weight="500" fill="#1F1F1F">www.gdgoau.com</text>
  </g>
</svg>
